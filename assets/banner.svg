<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#101f42"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes pulseSun {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatText {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .sun-core { transform-origin: 1050px 100px; animation: pulseSun 4s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 20, 10; animation: dashFlow 3s linear infinite; }
      .main-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; animation: floatText 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Solar Grid / Isometric Panels -->
  <g opacity="0.4" transform="translate(100, 180) rotate(-10)">
    <polygon points="0,120 180,60 360,120 180,180" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="200,120 380,60 560,120 380,180" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="400,120 580,60 760,120 580,180" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Grid Lines -->
    <line x1="90" y1="90" x2="270" y2="150" stroke="#0284c7" stroke-width="1"/>
    <line x1="290" y1="90" x2="470" y2="150" stroke="#0284c7" stroke-width="1"/>
    <line x1="490" y1="90" x2="670" y2="150" stroke="#0284c7" stroke-width="1"/>
  </g>

  <!-- Animated Data Streams -->
  <path d="M 50,320 Q 300,280 600,320 T 1150,220" fill="none" stroke="url(#glowLine)" stroke-width="3" class="data-stream" filter="url(#glow)"/>
  <path d="M 50,340 Q 400,380 750,310 T 1150,180" fill="none" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="2" class="data-stream" style="animation-duration: 4s;"/>

  <!-- Sun Element -->
  <g class="sun-core">
    <circle cx="1050" cy="100" r="110" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>
    <circle cx="1050" cy="100" r="75" fill="url(#sunGrad)" filter="url(#glow)"/>
  </g>

  <!-- Text Header -->
  <g transform="translate(80, 130)">
    <rect x="0" y="-35" width="230" height="34" rx="17" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="15" y="-12" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">☀️ AWESOME ECOSYSTEM</text>
    
    <text x="0" y="45" class="main-title" fill="#ffffff" font-size="44" letter-spacing="-0.5">Solar Asset Management</text>
    <text x="0" y="85" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="400">Curated SaaS Platforms, Open-Source Tools, APM &amp; PV Analytics</text>
    
    <!-- Feature Pills -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="20" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">📊 SaaS Pricing</text>
      
      <rect x="145" y="0" width="160" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="159" y="20" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="600">⭐ Open Source Repos</text>
      
      <rect x="320" y="0" width="150" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="334" y="20" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="600">⚡ Market Analytics</text>
    </g>
  </g>
</svg>
